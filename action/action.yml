name: 'MCP Security Audit'
description: 'Taint-scan an MCP server for arbitrary file write, command injection, and SQL injection via tool inputs, using MCP-aware CodeQL queries.'
author: 'stillmarcus24'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  source-root:
    description: 'Path to the MCP server source to scan'
    required: false
    default: '.'
  fail-on-finding:
    description: 'Fail the job if any taint flow is found'
    required: false
    default: 'true'
outputs:
  verdict:
    description: 'CLEAN, FINDINGS, or NO_SOURCE. NO_SOURCE means nothing was scanned and is never a silent pass.'
    value: ${{ steps.scan.outputs.verdict }}
  path:
    description: 'Count of CWE-22 path-traversal / arbitrary-write flows'
    value: ${{ steps.scan.outputs.path }}
  cmd:
    description: 'Count of CWE-78 command-injection flows'
    value: ${{ steps.scan.outputs.cmd }}
  sql:
    description: 'Count of CWE-89 SQL-injection flows'
    value: ${{ steps.scan.outputs.sql }}
runs:
  using: 'composite'
  steps:
    - id: scan
      shell: bash
      run: ${{ github.action_path }}/scan.sh "${{ inputs.source-root }}" "${{ inputs.fail-on-finding }}"
